name: Agent Lab CI

on:
  pull_request:
    paths:
      - 'agent-lab/**'
      - '.github/workflows/agent-lab.yml'
  push:
    branches:
      - chatgpt-agent-lab
    paths:
      - 'agent-lab/**'
      - '.github/workflows/agent-lab.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run lab tests
        run: python3 -m unittest discover -s agent-lab/tests -v
